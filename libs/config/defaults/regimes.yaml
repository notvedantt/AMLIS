version: "0.1.0"
states:
  - name: "low_vol"
    index: 0
    description: "Low-volatility trending or mean-reverting market"
    max_volatility: 0.15
  - name: "transitional"
    index: 1
    description: "Transitional regime with increasing dispersion and uncertainty"
    min_volatility: 0.15
    max_volatility: 0.35
  - name: "high_vol"
    index: 2
    description: "High-volatility regime with extreme swings or liquidity contraction"
    min_volatility: 0.35

hmm:
  n_states: 3
  features:
    - "volatility_20"
    - "sma_20"
  covariance_type: "diag"
  min_history_bars: 100

shock_detector:
  anomaly_threshold_std: 2.5
  lookback_window: 60
  min_reconstruction_error: 0.05
